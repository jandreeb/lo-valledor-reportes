<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LV Assistant</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<meta name="theme-color" content="#111827">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

<h1>LV Assistant</h1>

<p>Sistema de Reportes Lo Valledor</p>

</header>
  
<section class="turno-dia">

<h2>📅 Turno de Hoy</h2>

<p id="turnoHoy">Calculando...</p>

</section>
  
<section class="semana">

<h2>Configuración Semanal</h2>

<label>

Indicativo

<select id="indicativo"></select>

<button type="button" id="agregarIndicativo">
➕ Agregar indicativo
</button>

</label>

<label>

Patio

<select id="patio">

<option>Patio 1</option>

<option>Patio 2</option>

<option>Patio Norte</option>

<option>Cobertizos</option>

</select>

</label>

<label>

Jefe Cuadrante

<input
id="jefe"
type="text"
placeholder="Ej: Gonzalo Sanhueza - Oscar 1">

</label>

<button id="guardarSemana">

Guardar Configuración

</button>

</section>

<section class="menu">

<h2>Procedimientos</h2>

<div class="grid">

<button class="menuBtn">🛒 Ambulante</button>

<button class="menuBtn">🚫 Bloqueo</button>

<button class="menuBtn">📄 Notificación</button>

<button class="menuBtn">📑 Citación</button>

<button class="menuBtn">📦 Corralito</button>

<button class="menuBtn">🔒 Resguardo</button>

<button class="menuBtn">⚡ Sin Energía</button>

<button class="menuBtn">🚪 Apertura</button>

<button class="menuBtn">🧹 Ordenamiento</button>

<button class="menuBtn">➕ Otro</button>

</div>

</section>

<section class="historial">

<h2>Últimos Procedimientos</h2>

<div id="listaProcedimientos">

<p>Aún no existen procedimientos.</p>

</div>

</section>

<footer>

<p>

LV Assistant ©️ 2026

</p>

</footer>

<script src="app.js"></script>

</body>

</html>
